<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC 700 AI Coach - 穩定連線版</title>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --border: #dadce0; --ai-bg: #e8f0fe; }
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        /* 側邊欄：AI 對話區 */
        #sidebar { width: 380px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .sidebar-header { background: var(--primary); color: white; padding: 20px; }
        .status-badge { background: #ffd700; color: #333; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-top: 8px; display: inline-block; }
        .api-config { padding: 15px; background: #fff9e6; border-bottom: 1px solid #ffeeba; }
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
        .ai-msg { background: var(--ai-bg); color: #1a73e8; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background: white; border: 1px solid #ddd; align-self: flex-end; border-bottom-right-radius: 2px; }
        .input-area { padding: 15px; border-top: 1px solid var(--border); background: white; }
        
        /* 主畫面：診斷測驗區 */
        #main { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
        .q-card { background: white; padding: 30px; border-radius: 16px; margin-bottom: 30px; border: 1px solid var(--border); }
        .question-text { font-size: 1.2rem; font-weight: 600; color: #202124; margin-bottom: 20px; }
        .option-item { display: block; padding: 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .option-item:hover { background: #f1f3f4; }
        .analysis-box { background: #fafafa; border: 1px solid #eee; padding: 20px; border-radius: 12px; margin-top: 20px; }
        textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; min-height: 80px; font-family: inherit; font-size: 0.9rem; }
        .primary-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .primary-btn:hover { background: #1765cc; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0;">TOEIC AI Coach</h2>
        <div class="status-badge">目標：700 分 | 目前：555 分</div>
    </div>
    <div class="api-config">
        <label style="font-size: 0.8rem; font-weight: bold;">🔑 Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="貼上金鑰後傳送「測試」" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; margin-top: 5px;">
    </div>
    <div class="chat-container" id="chatHistory">
        <div class="msg ai-msg">教練已就緒。請在上方貼上金鑰，並傳送「測試」來確認連線。</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="對教練提問..." style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:4px;" onkeypress="if(event.keyCode==13) askAI()">
        <button class="primary-btn" style="padding: 10px;" onclick="askAI()">發送指令</button>
    </div>
</div>

<div id="main">
    <div style="max-width: 800px; margin: auto;">
        <h1>📊 多益深度診斷 (10 題核心版)</h1>
        <p style="color: #666;">請作答並在下方填寫你的解題邏輯，這些資訊將作為 AI 調整教學方針的依據。</p>
        <div id="quiz-list"></div>
        <button class="primary-btn" onclick="saveProgress()">💾 儲存今日練習進度</button>
        <p id="saveStatus" style="text-align: center; color: green; font-weight: bold; margin-top: 10px;"></p>
    </div>
</div>

<script>
    // 核心 10 題多益模擬題
    const questions = [
        { q: "The project manager insisted that all team members ______ the safety guidelines.", options: ["(A) follows", "(B) followed", "(C) follow", "(D) following"] },
        { q: "Due to ______ circumstances, the workshop has been canceled.", options: ["(A) unforeseen", "(B) uninterested", "(C) unlimited", "(D) unstable"] },
        { q: "The ______ of the results will be shared during the next meeting.", options: ["(A) analyze", "(B) analysis", "(C) analytic", "(D) analyzed"] },
        { q: "The new equipment is ______ more efficient than the older models.", options: ["(A) significantly", "(B) significance", "(C) significant", "(D) signified"] },
        { q: "Ms. Lee will be traveling to Germany ______ she can finalize the contract.", options: ["(A) so that", "(B) in order to", "(C) instead of", "(D) because of"] },
        { q: "The CEO ______ the merger before the press conference took place.", options: ["(A) has announced", "(B) had announced", "(C) announces", "(D) announcing"] },
        { q: "Any staff members ______ to attend the seminar must register by Friday.", options: ["(A) wish", "(B) wishes", "(C) wishing", "(D) wished"] },
        { q: "The budget report provides a ______ breakdown of the company's expenses.", options: ["(A) comprehensive", "(B) comprehend", "(C) comprehension", "(D) comprehensibly"] },
        { q: "Please ______ from using mobile phones during the session.", options: ["(A) refrain", "(B) avoid", "(C) prevent", "(D) stop"] },
        { q: "The investment will prove ______ in the long run despite initial costs.", options: ["(A) profitable", "(B) profitably", "(C) profitability", "(D) profiting"] }
    ];

    // 初始化題目
    const quizList = document.getElementById('quiz-list');
    questions.forEach((item, i) => {
        const savedData = JSON.parse(localStorage.getItem('toeic_700_save')) || { responses: [] };
        const savedAns = savedData.responses[i]?.ans || "";
        const savedLogic = savedData.responses[i]?.logic || "";

        quizList.innerHTML += `
            <div class="q-card">
                <div class="question-text">${i+1}. ${item.q}</div>
                <div>${item.options.map(opt => `
                    <label class="option-item">
                        <input type="radio" name="q${i}" value="${opt[1]}" ${savedAns === opt[1] ? 'checked' : ''}> ${opt}
                    </label>`).join('')}
                </div>
                <div class="analysis-box">
                    <label style="font-size:0.85rem; font-weight:bold; color:#666;">💡 你的思路/筆記：</label>
                    <textarea id="logic${i}" placeholder="為什麼選這個答案？或是有哪個單字不熟？">${savedLogic}</textarea>
                </div>
            </div>
        `;
    });

    // AI 對話功能
    async function askAI() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userInput = document.getElementById('userInput').value.trim();
        const chatHistory = document.getElementById('chatHistory');

        if (!apiKey) return alert("請先在上方輸入 API Key！");
        if (!userInput) return;

        chatHistory.innerHTML += `<div class="msg user-msg">${userInput}</div>`;
        document.getElementById('userInput').value = "";
        chatHistory.scrollTop = chatHistory.scrollHeight;

        try {
            // 使用穩定版 gemini-pro 模型
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `你是一位專業多益教練，協助 555 分學生衝刺 700 分。請簡短回覆學生：${userInput}` }] }]
                })
            });

            const data = await response.json();
            if (response.ok && data.candidates) {
                const aiReply = data.candidates[0].content.parts[0].text;
                chatHistory.innerHTML += `<div class="msg ai-msg"><b>教練：</b>${aiReply}</div>`;
            } else {
                chatHistory.innerHTML += `<div class="msg ai-msg" style="color:red;">連線失敗：${data.error.message}</div>`;
            }
        } catch (e) {
            chatHistory.innerHTML += `<div class="msg ai-msg" style="color:red;">網路連線錯誤。</div>`;
        }
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // 儲存進度至 LocalStorage
    function saveProgress() {
        const data = {
            metadata: { lastUpdate: new Date().toLocaleString() },
            responses: questions.map((_, i) => ({
                ans: document.querySelector(`input[name="q${i}"]:checked`)?.value || "",
                logic: document.getElementById(`logic${i}`).value
            }))
        };
        localStorage.setItem('toeic_700_save', JSON.stringify(data));
        document.getElementById('saveStatus').innerText = "✅ 進度已儲存於瀏覽器（重新整理也不會消失）";
        setTimeout(() => document.getElementById('saveStatus').innerText = "", 3000);
    }
</script>
</body>
</html>
